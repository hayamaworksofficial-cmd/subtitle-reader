<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>字幕読み上げカメラ</title><style>body{font-family:system-ui,sans-serif;background:#111827;color:#f9fafb;margin:0}main{max-width:720px;margin:auto;padding:16px}h1{font-size:1.3rem}.viewer{position:relative;background:#000;border-radius:12px;overflow:hidden;touch-action:none}video{width:100%;display:block;max-height:60vh;object-fit:contain}canvas#overlay{position:absolute;inset:0;width:100%;height:100%;touch-action:none}button,select,input{font:inherit}button{border:0;border-radius:8px;padding:12px 16px;background:#2563eb;color:white;margin:4px}button:disabled{opacity:.5}.controls{display:flex;flex-wrap:wrap}label{display:block;margin:12px 0}output,#status{color:#93c5fd}#recognized{background:#1f2937;padding:12px;border-radius:8px;min-height:48px;white-space:pre-wrap}.note{font-size:.85rem;color:#cbd5e1}input[type=range]{width:100%}</style></head><body><main><h1>📷 字幕読み上げカメラ v0.1</h1><p class="note">カメラ起動後、青い枠をドラッグして字幕範囲を指定してください。</p><div class="viewer" id="viewer"><video id="video" autoplay playsinline muted></video><canvas id="overlay"></canvas></div><div class="controls"><button id="start">カメラ起動・開始</button><button id="pause" disabled>一時停止</button><button id="reset">範囲をリセット</button><button id="stop" disabled>終了</button></div><label>読み上げ速度 <output id="rateValue">1.0</output>倍<input id="rate" type="range" min="0.5" max="2" step="0.1" value="1"></label><label><input id="debug" type="checkbox"> OCR処理状況を表示</label><p id="status" role="status">待機中</p><h2>認識した字幕</h2><div id="recognized">ここに字幕が表示されます</div><p class="note">字幕が600ms安定すると読み上げます。最新優先：再生中の音声は最後まで読み、待機中の古い字幕は新しい字幕で置き換えます。音声の自動再生は端末により制限されることがあります。</p></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),v=$('video'),overlay=$('overlay'),ctx=overlay.getContext('2d'),status=$('status'),recognized=$('recognized');let worker=null,stream=null,running=false,paused=false,busy=false,timer=null,selection={x:.05,y:.68,w:.9,h:.24},drag=null,previous='',candidate='',candidateSince=0,spoken='',latestPending=null,speaking=false,epoch=0;const INTERVAL=700,STABLE=600;const capture=document.createElement('canvas'),capctx=capture.getContext('2d',{willReadFrequently:true});const setStatus=t=>status.textContent=t;function paint(){const r=overlay.getBoundingClientRect(),d=window.devicePixelRatio||1;overlay.width=Math.round(r.width*d);overlay.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,r.width,r.height);ctx.fillStyle='rgba(0,0,0,.32)';ctx.fillRect(0,0,r.width,r.height);ctx.clearRect(selection.x*r.width,selection.y*r.height,selection.w*r.width,selection.h*r.height);ctx.strokeStyle='#38bdf8';ctx.lineWidth=3;ctx.strokeRect(selection.x*r.width,selection.y*r.height,selection.w*r.width,selection.h*r.height)}const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));function coords(e){const r=overlay.getBoundingClientRect();return{x:clamp((e.clientX-r.left)/r.width,0,1),y:clamp((e.clientY-r.top)/r.height,0,1)}}overlay.addEventListener('pointerdown',e=>{drag=coords(e);overlay.setPointerCapture(e.pointerId)});overlay.addEventListener('pointermove',e=>{if(!drag)return;const p=coords(e);selection={x:Math.min(drag.x,p.x),y:Math.min(drag.y,p.y),w:Math.abs(drag.x-p.x),h:Math.abs(drag.y-p.y)};paint()});overlay.addEventListener('pointerup',()=>{drag=null;if(selection.w<.03||selection.h<.03)selection={x:.05,y:.68,w:.9,h:.24};previous='';candidate='';candidateSince=0;spoken='';paint()});window.addEventListener('resize',paint);$('reset').onclick=()=>{selection={x:.05,y:.68,w:.9,h:.24};previous='';candidate='';spoken='';paint()};$('rate').oninput=()=>{$('rateValue').textContent=Number($('rate').value).toFixed(1)};function clean(t){return t.replace(/\s+/g,' ').trim()}function enqueue(text){if(text===spoken||text===latestPending)return;latestPending=text;playNext()}function playNext(){if(speaking||!latestPending||paused||!running)return;const text=latestPending;latestPending=null;spoken=text;if(!('speechSynthesis'in window)){setStatus('このブラウザは読み上げ非対応です');return}const utter=new SpeechSynthesisUtterance(text);utter.lang='ja-JP';utter.rate=Number($('rate').value);speaking=true;utter.onend=utter.onerror=()=>{speaking=false;playNext()};speechSynthesis.speak(utter)}function clearSpeech(){if('speechSynthesis'in window)speechSynthesis.cancel();speaking=false;latestPending=null}async function tick(myEpoch){if(!running||paused||busy||!worker||v.readyState<2||myEpoch!==epoch)return;busy=true;try{const W=v.videoWidth,H=v.videoHeight;if(!W||!H)return;const x=Math.floor(selection.x*W),y=Math.floor(selection.y*H),w=Math.max(1,Math.floor(selection.w*W)),h=Math.max(1,Math.floor(selection.h*H));capture.width=w;capture.height=h;capctx.drawImage(v,x,y,w,h,0,0,w,h);const result=await worker.recognize(capture);if(myEpoch!==epoch||!running||paused)return;const text=clean(result.data.text),now=performance.now();if(text!==candidate){candidate=text;candidateSince=now}else if(text&&now-candidateSince>=STABLE&&text!==previous){previous=text;recognized.textContent=text;enqueue(text)}if(!text){previous='';spoken=''}if($('debug').checked)setStatus('OCR: '+(text||'文字なし'));else setStatus('認識中')}catch(e){setStatus('OCRエラー: '+e.message)}finally{busy=false}}async function stop(){running=false;paused=false;epoch++;clearInterval(timer);timer=null;clearSpeech();if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}v.srcObject=null;const old=worker;worker=null;if(old)try{await old.terminate()}catch{}$('start').disabled=false;$('pause').disabled=true;$('pause').textContent='一時停止';$('stop').disabled=true;setStatus('停止しました')}$('stop').onclick=stop;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'再開':'一時停止';if(paused){clearSpeech();setStatus('一時停止中')}else{spoken='';candidate='';previous='';setStatus('認識再開');playNext()}};$('start').onclick=async()=>{if(running)return;$('start').disabled=true;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('HTTPS接続が必要です');if(typeof Tesseract==='undefined')throw Error('OCRライブラリを読み込めません');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});v.srcObject=stream;await v.play();paint();setStatus('日本語OCRを準備しています…');worker=await Tesseract.createWorker('jpn',1);running=true;paused=false;const myEpoch=++epoch;$('pause').disabled=false;$('stop').disabled=false;setStatus('認識中');timer=setInterval(()=>tick(myEpoch),INTERVAL);tick(myEpoch)}catch(e){setStatus('開始できません: '+e.message);await stop();setStatus('開始できません: '+e.message)}};paint()})();
</script></body></html>
