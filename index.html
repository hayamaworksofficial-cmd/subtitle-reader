<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>字幕読み上げカメラ</title><style>body{font-family:system-ui,sans-serif;background:#111827;color:#f9fafb;margin:0}main{max-width:720px;margin:auto;padding:16px}h1{font-size:1.3rem}.viewer{position:relative;background:#000;border-radius:12px;overflow:hidden;touch-action:none}video{width:100%;display:block;max-height:60vh;object-fit:contain}canvas#overlay{position:absolute;inset:0;width:100%;height:100%;touch-action:none}button,select,input{font:inherit}button{border:0;border-radius:8px;padding:12px 16px;background:#2563eb;color:white;margin:4px}button:disabled{opacity:.5}.controls{display:flex;flex-wrap:wrap}label{display:block;margin:12px 0}output,#status{color:#93c5fd}#recognized{background:#1f2937;padding:12px;border-radius:8px;min-height:48px;white-space:pre-wrap}.note{font-size:.85rem;color:#cbd5e1}input[type=range]{width:100%}</style></head><body><main><h1>📷 字幕読み上げカメラ v0.5</h1><p class="note">カメラ起動後、青い枠をドラッグして字幕範囲を指定してください。</p><div class="viewer" id="viewer"><video id="video" autoplay playsinline muted></video><canvas id="overlay"></canvas></div><div class="controls"><button id="start">カメラ起動・開始</button><button id="pause" disabled>一時停止</button><button id="reset">範囲をリセット</button><button id="stop" disabled>終了</button></div><label>読み上げ速度 <output id="rateValue">1.0</output>倍<input id="rate" type="range" min="0.5" max="2" step="0.1" value="1"></label><label><input id="debug" type="checkbox" checked> OCR処理状況を表示</label><button id="once" disabled>1回だけ文字認識テスト</button><p class="note" id="diagnostic">診断：待機中</p><p id="status" role="status">待機中</p><h2>認識した字幕</h2><div id="recognized">ここに字幕が表示されます</div><p class="note">日本語の文字間の不要な空白を除去します。字幕が約1.5秒安定し、連続2回以上一致したら読み上げます。最新優先：再生中の音声は最後まで読み、待機中の古い字幕は新しい字幕で置き換えます。音声の自動再生は端末により制限されることがあります。</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),v=$('video'),overlay=$('overlay'),ctx=overlay.getContext('2d'),status=$('status'),recognized=$('recognized');let worker=null,stream=null,running=false,paused=false,busy=false,timer=null,scanCount=0,lastText='',lastChanged=0,shownText='',lastImage=null,stableCount=0,blankCount=0,lastSpokenAt=0,selection={x:.05,y:.68,w:.9,h:.24},drag=null,previous='',candidate='',candidateSince=0,spoken='',latestPending=null,speaking=false,epoch=0;const INTERVAL=700,STABLE=1500;const capture=document.createElement('canvas'),capctx=capture.getContext('2d',{willReadFrequently:true});const setStatus=t=>status.textContent=t;const diagnostic=t=>$('diagnostic').textContent='診断：'+t;

function paint(){const r=overlay.getBoundingClientRect(),d=window.devicePixelRatio||1;overlay.width=Math.round(r.width*d);overlay.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,r.width,r.height);ctx.fillStyle='rgba(0,0,0,.32)';ctx.fillRect(0,0,r.width,r.height);ctx.clearRect(selection.x*r.width,selection.y*r.height,selection.w*r.width,selection.h*r.height);ctx.strokeStyle='#38bdf8';ctx.lineWidth=3;ctx.strokeRect(selection.x*r.width,selection.y*r.height,selection.w*r.width,selection.h*r.height)}const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));function coords(e){const r=overlay.getBoundingClientRect();return{x:clamp((e.clientX-r.left)/r.width,0,1),y:clamp((e.clientY-r.top)/r.height,0,1)}}overlay.addEventListener('pointerdown',e=>{drag=coords(e);overlay.setPointerCapture(e.pointerId)});overlay.addEventListener('pointermove',e=>{if(!drag)return;const p=coords(e);selection={x:Math.min(drag.x,p.x),y:Math.min(drag.y,p.y),w:Math.abs(drag.x-p.x),h:Math.abs(drag.y-p.y)};paint()});overlay.addEventListener('pointerup',()=>{drag=null;if(selection.w<.03||selection.h<.03)selection={x:.05,y:.68,w:.9,h:.24};previous='';candidate='';candidateSince=0;spoken='';lastText='';shownText='';stableCount=0;blankCount=0;lastChanged=0;paint()});window.addEventListener('resize',paint);$('reset').onclick=()=>{selection={x:.05,y:.68,w:.9,h:.24};previous='';candidate='';spoken='';lastText='';shownText='';stableCount=0;blankCount=0;lastChanged=0;paint()};$('rate').oninput=()=>{$('rateValue').textContent=Number($('rate').value).toFixed(1)};function clean(t){return t.replace(/\r/g,'').replace(/[ \t\u3000]+/g,' ').replace(/([\u3040-\u30ff\u3400-\u9fff]) +(?=[\u3040-\u30ff\u3400-\u9fff])/g,'$1').replace(/\n+/g,' ').replace(/ +/g,' ').trim()}function similar(a,b){if(!a||!b)return false;const x=a.replace(/[\s、。,.!！?？「」『』]/g,''),y=b.replace(/[\s、。,.!！?？「」『』]/g,'');if(x===y)return true;if(Math.min(x.length,y.length)<4)return false;let same=0;for(let i=0;i<Math.min(x.length,y.length);i++)if(x[i]===y[i])same++;return same/Math.max(x.length,y.length)>=.85}function enqueue(text){if(text===spoken||text===latestPending)return;latestPending=text;playNext()}function playNext(){if(speaking||!latestPending||paused||!running)return;const text=latestPending;latestPending=null;spoken=text;if(!('speechSynthesis'in window)){setStatus('このブラウザは読み上げ非対応です');return}const utter=new SpeechSynthesisUtterance(text);utter.lang='ja-JP';utter.rate=Number($('rate').value);speaking=true;utter.onend=utter.onerror=()=>{speaking=false;playNext()};speechSynthesis.speak(utter)}function clearSpeech(){if('speechSynthesis'in window)speechSynthesis.cancel();speaking=false;latestPending=null}async function tick(myEpoch,manual=false){if(!running||paused||busy||!worker||v.readyState<2||myEpoch!==epoch){if(manual)diagnostic('実行不可：'+(!running?'未起動':paused?'一時停止中':busy?'OCR処理中':!worker?'OCR未準備':v.readyState<2?'映像未準備':'セッション変更'));return}busy=true;scanCount++;const number=scanCount;try{setStatus('OCR処理中（'+number+'回目）');diagnostic('画像を取得しています');const W=v.videoWidth,H=v.videoHeight;if(!W||!H)throw Error('カメラ映像サイズが取得できません');const x=Math.floor(selection.x*W),y=Math.floor(selection.y*H),w=Math.max(1,Math.floor(selection.w*W)),h=Math.max(1,Math.floor(selection.h*H));if(w<20||h<20)throw Error('青い枠が小さすぎます');const scale=Math.min(3,Math.max(1,900/w));capture.width=Math.round(w*scale);capture.height=Math.round(h*scale);capctx.fillStyle='white';capctx.fillRect(0,0,capture.width,capture.height);capctx.drawImage(v,x,y,w,h,0,0,capture.width,capture.height);diagnostic('OCR実行中（'+number+'回目・'+w+'×'+h+'px）');const result=await Promise.race([worker.recognize(capture),new Promise((_,reject)=>setTimeout(()=>reject(Error('OCRが20秒以上応答しません。ページを再読み込みしてください')),20000))]);if(myEpoch!==epoch||!running||paused)return;const text=clean(result.data.text||''),now=performance.now();diagnostic('OCR完了 '+number+'回目 / 信頼度 '+Math.round(result.data.confidence||0)+'% / '+(text?'文字あり':'文字なし'));if(!text){blankCount++;if(blankCount>=2){lastText='';stableCount=0;lastChanged=0;shownText='';spoken=''}diagnostic('OCR完了 '+number+'回目 / 文字なし（'+blankCount+'回）')}else{blankCount=0;if(similar(text,lastText)){stableCount++;if(text.length>lastText.length)lastText=text}else{lastText=text;stableCount=1;lastChanged=now}diagnostic('OCR完了 '+number+'回目 / 候補: '+lastText+' / 安定 '+stableCount+'回 / '+Math.round(now-lastChanged)+'ms');if(manual||(stableCount>=2&&now-lastChanged>=STABLE)){if(!similar(lastText,shownText)&&!(similar(lastText,spoken)&&now-lastSpokenAt<8000)){shownText=lastText;recognized.textContent=lastText;enqueue(lastText);lastSpokenAt=now}}}setStatus('OCR '+number+'回目: '+(text||'文字なし'))}catch(e){setStatus('OCRエラー: '+e.message);diagnostic('エラー '+e.message)}finally{busy=false}}async function stop(){running=false;paused=false;epoch++;clearInterval(timer);timer=null;clearSpeech();if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}v.srcObject=null;const old=worker;worker=null;if(old)try{await old.terminate()}catch{}$('start').disabled=false;$('once').disabled=true;$('pause').disabled=true;$('pause').textContent='一時停止';$('stop').disabled=true;setStatus('停止しました')}$('stop').onclick=stop;$('once').onclick=()=>tick(epoch,true);$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'再開':'一時停止';if(paused){clearSpeech();setStatus('一時停止中')}else{spoken='';candidate='';previous='';lastText='';stableCount=0;blankCount=0;setStatus('認識再開');playNext()}};$('start').onclick=async()=>{if(running)return;$('start').disabled=true;setStatus('起動処理を開始しました…');try{if(!navigator.mediaDevices?.getUserMedia)throw Error('HTTPS接続が必要です');setStatus('カメラへのアクセスを要求しています…');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});v.srcObject=stream;await v.play();paint();setStatus('カメラ起動成功。OCRライブラリを読み込んでいます…');await loadOCR();setStatus('日本語OCRを準備しています…');worker=await Tesseract.createWorker('jpn',1);running=true;paused=false;const myEpoch=++epoch;$('pause').disabled=false;$('stop').disabled=false;$('once').disabled=false;setStatus('認識中・OCR開始待ち');diagnostic('OCR準備完了。認識を開始します');timer=setInterval(()=>tick(myEpoch),INTERVAL);tick(myEpoch)}catch(e){setStatus('開始できません: '+e.message);diagnostic('起動失敗 '+e.message);await stop();setStatus('開始できません: '+e.message)}};paint()})();
</script></body></html>
